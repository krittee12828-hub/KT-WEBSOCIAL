<style id="app-css">
/* layout idea: atlas sheet. graticule grid, ruler ticks, strand colours as map legend */
:root{
  --bg:#EDF2F5;--surface:#FFFFFF;--surface2:#E2EAEF;--ink:#0F2335;--muted:#566B7B;--line:#CBD7DF;
  --accent:#D43B21;--accent-ink:#FFFFFF;--accent2:#0E7C86;--accent2-ink:#FFFFFF;
  --radius:16px;--width:1120px;--cols:3;--scale:1;--head-w:400;
  --head:'Chonburi','Prompt',serif;--body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1620;--surface:#13222F;--surface2:#1A2D3C;--ink:#E8EFF4;--muted:#93A8B7;--line:#274052;
    --accent:#FF6B4D;--accent-ink:#0F2335;--accent2:#3FC1CC;--accent2-ink:#0F2335;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1620;--surface:#13222F;--surface2:#1A2D3C;--ink:#E8EFF4;--muted:#93A8B7;--line:#274052;
  --accent:#FF6B4D;--accent-ink:#0F2335;--accent2:#3FC1CC;--accent2-ink:#0F2335;color-scheme:dark;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--scale));-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.7 var(--body);-webkit-font-smoothing:antialiased}
body.editing{padding-bottom:5.5rem}
h1,h2,h3,h4{font-family:var(--head);font-weight:var(--head-w);line-height:1.4;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font-family:inherit}
.wrap{width:100%;max-width:var(--width);margin-inline:auto;padding-inline:max(16px,4vw)}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.ic{flex:none}
:focus-visible{outline:3px solid color-mix(in oklab,var(--accent) 75%,#fff);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;padding:.7rem 1.25rem;border-radius:calc(var(--radius) * .75);border:1.5px solid var(--ink);background:transparent;color:var(--ink);font:600 1rem/1.3 var(--body);text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:.4rem .85rem;font-size:.9rem}
.btn.ghost{border-color:var(--line);background:var(--surface)}
.ib{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;padding:0}
.ib:hover{background:var(--surface2)}

/* ---------- editable text ---------- */
body.editing [contenteditable="true"]{outline:1.5px dashed color-mix(in oklab,var(--accent) 60%,transparent);outline-offset:3px;border-radius:4px;cursor:text;min-width:2ch}
body.editing [contenteditable="true"]:hover{background:color-mix(in oklab,var(--accent) 8%,transparent)}
body.editing [contenteditable="true"]:focus{outline:2px solid var(--accent);background:color-mix(in oklab,var(--accent) 10%,transparent)}
[contenteditable="true"]:empty::before{content:attr(data-ph);opacity:.5}
.ed-only{display:none!important}
body.editing .ed-only{display:inline-flex!important}

/* ---------- nav ---------- */
.nav{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:.5rem 1.5rem;flex-wrap:wrap;padding-block:.55rem}
.brand{display:flex;align-items:center;gap:.7rem;text-decoration:none}
.brand-mark{display:grid;place-items:center;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--accent);color:var(--accent-ink)}
.brand-t{display:flex;flex-direction:column;line-height:1.25}
.brand-t b{font-family:var(--head);font-weight:var(--head-w);font-size:1.1rem;letter-spacing:.02em}
.brand-t small{font-size:.8rem;color:var(--muted)}
.nl-wrap{display:flex;gap:.25rem;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nl-wrap::-webkit-scrollbar{display:none}
.nl{flex:none;text-decoration:none;font-weight:600;font-size:.95rem;padding:.35rem .8rem;border-radius:99px;color:var(--muted)}
.nl:hover{background:var(--surface2);color:var(--ink)}

/* ---------- hero ---------- */
.hero{padding:clamp(2rem,5vw,4rem) 0 clamp(1.5rem,3vw,2.5rem);position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in oklab,var(--ink) 6%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--ink) 6%,transparent) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(180deg,#000 30%,transparent 95%);-webkit-mask-image:linear-gradient(180deg,#000 30%,transparent 95%);pointer-events:none}
.hero .wrap{position:relative}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(1.5rem,4vw,3rem);align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.875rem;color:var(--accent2);background:color-mix(in oklab,var(--accent2) 13%,transparent);padding:.3rem .85rem;border-radius:99px;margin-bottom:1rem}
.hero h1{font-size:clamp(2rem,1.1rem + 3.4vw,3.5rem);margin-bottom:1rem}
.lead{font-size:1.125rem;color:var(--muted);max-width:58ch}
.uses-h{font-weight:700;margin:1.5rem 0 .5rem}
.uses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem 1rem;list-style:none;padding:0;margin:0 0 1.5rem}
.uses li{display:flex;gap:.6rem;align-items:flex-start;line-height:1.45}
.u-ic{display:grid;place-items:center;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--accent2);color:var(--accent2-ink);margin-top:.15rem;flex:none}
.uses b{display:block;font-size:.98rem}
.uses span.d{display:block;font-size:.85rem;color:var(--muted)}
.cta{display:flex;gap:.75rem;flex-wrap:wrap}
.badges{display:flex;flex-wrap:wrap;gap:.5rem;list-style:none;padding:0;margin:1.25rem 0 0}
.badges li{display:flex;align-items:center;gap:.4rem;font-size:.875rem;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:.25rem .8rem;background:var(--surface)}
.badges .ic{color:var(--accent2)}
.hero-art{display:grid;place-items:center}
.hero-art svg,.hero-img{width:min(100%,440px);height:auto}
.hero-img{border-radius:var(--radius);object-fit:contain}
.g-ring line{stroke:var(--muted)}
.g-ring{transform-origin:200px 200px;animation:spin 120s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.g-body{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.g-line{fill:none;stroke:color-mix(in oklab,var(--muted) 50%,transparent);stroke-width:1.2}
.g-eq{stroke:var(--accent);stroke-width:2.2}
.g-pin{fill:var(--accent)}
.g-lbl{font:600 11px var(--body);fill:var(--ink)}
.g-lbl-bg{fill:var(--surface);opacity:.92}
.g-lead{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:3 3}

.stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem;margin-top:clamp(1.75rem,4vw,3rem)}
.stage{background:var(--surface);border:1px solid var(--line);border-top:4px solid color-mix(in oklab,var(--accent) calc(100% - var(--i) * 33%),var(--accent2));border-radius:var(--radius);padding:1.1rem 1.1rem 1rem;display:flex;flex-direction:column;gap:.35rem}
.stage .rng{font:600 .85rem var(--body);color:var(--muted);letter-spacing:.03em}
.stage h3{font-size:1.35rem}
.stage .topics{font-size:.92rem;color:var(--muted);flex:1}
.stage .cnt{font-size:.85rem;font-weight:700;margin-top:.4rem}
.stage .btn{margin-top:.5rem;justify-content:space-between}

@media (max-width:860px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-art svg,.hero-img{width:min(100%,360px)}}
@media (max-width:980px){.stages{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.stages{grid-template-columns:minmax(0,1fr)}.stage .btn{justify-content:center;gap:.5rem}}
/* ---------- sections ---------- */
.sec{padding:clamp(2.5rem,6vw,4.5rem) 0;scroll-margin-top:4rem}
.sec.alt{background:color-mix(in oklab,var(--surface2) 55%,var(--bg))}
section[id]{scroll-margin-top:4rem}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.5rem}
.sec-head h2{font-size:clamp(1.6rem,1.1rem + 1.8vw,2.4rem)}
.sec-sub{color:var(--muted);margin-top:.3rem;max-width:60ch}

/* filters */
.filters{display:grid;gap:.75rem;margin-bottom:1rem}
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.35rem;scrollbar-width:thin;align-items:center}
.tab,.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:.35rem .9rem;border-radius:99px;font:600 .9rem/1.5 var(--body);cursor:pointer}
.tab:hover,.chip:hover{border-color:var(--ink)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sep{flex:none;width:1px;height:1.4rem;background:var(--line);margin-inline:.15rem}
.fl-row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fl-row .tabs{flex-wrap:wrap;overflow:visible}
.chip{display:inline-flex;align-items:center;gap:.45rem}
.chip i{width:.7rem;height:.7rem;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{background:color-mix(in oklab,var(--c,var(--ink)) 16%,var(--surface));border-color:var(--c,var(--ink))}
.search{display:flex;align-items:center;gap:.5rem;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:.3rem .9rem;min-width:min(100%,250px);color:var(--muted)}
.search input{border:0;background:transparent;font:inherit;color:var(--ink);width:100%;outline:0;padding:.1rem 0}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent)}
.count{font-size:.9rem;color:var(--muted);margin-bottom:1rem}

/* cards */
.grid{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:1.25rem}
@media (max-width:980px){.grid{grid-template-columns:repeat(min(var(--cols),2),minmax(0,1fr))}}
@media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px -16px color-mix(in oklab,var(--ink) 45%,transparent)}
.cover{position:relative;aspect-ratio:4/3;background:color-mix(in oklab,var(--c) 14%,var(--surface2));overflow:hidden;isolation:isolate}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(color-mix(in oklab,var(--c) 20%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--c) 20%,transparent) 1px,transparent 1px);background-size:22px 22px}
.cover.has-img::before{display:none}
.cover.has-img img{width:100%;height:100%;object-fit:cover}
.cv-ic{position:absolute;left:1rem;top:.9rem;color:var(--c)}
.cv-g{position:absolute;left:1rem;bottom:.5rem;font:var(--head-w) clamp(2.6rem,2rem + 2vw,3.6rem)/1.25 var(--head);color:color-mix(in oklab,var(--c) 82%,var(--ink))}
.sheet{position:absolute;right:1.1rem;top:1rem;width:40%;aspect-ratio:1/1.3;background:#fff;border-radius:6px;transform:rotate(4deg);box-shadow:0 8px 18px -8px rgba(15,35,53,.45);padding:.55rem .5rem;display:flex;flex-direction:column;gap:.35rem}
.sheet .band{display:block;height:.5rem;width:70%;background:var(--c);border-radius:3px}
.sheet .l{display:block;height:.26rem;background:#D5DEE5;border-radius:3px;width:100%}
.sheet .l.w2{width:72%}.sheet .l.w3{width:60%}
.sheet .bx{display:flex;gap:.3rem;align-items:center}
.sheet .bx b{width:.5rem;height:.5rem;border:1.5px solid var(--c);border-radius:2px;flex:none}
.card-tools{position:absolute;top:.6rem;right:.6rem;gap:.35rem;z-index:2}
.card-b{padding:1rem 1.1rem 1.1rem;display:flex;flex-direction:column;gap:.4rem;flex:1}
.tags{display:flex;gap:.35rem;flex-wrap:wrap}
.tag{font-size:.78rem;font-weight:700;padding:.1rem .6rem;border-radius:99px;background:color-mix(in oklab,var(--c) 16%,var(--surface));color:color-mix(in oklab,var(--c) 68%,var(--ink))}
.tag.solid{background:color-mix(in oklab,var(--c) 85%,var(--ink));color:var(--surface)}
.card h3{font-size:1.15rem}
.meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:.92rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-a{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:auto;padding-top:.6rem}
.empty{grid-column:1/-1;text-align:center;padding:2.5rem 1rem;border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--muted);display:grid;gap:.75rem;justify-items:center}

/* ruler (bundle) */
.bundle{margin-top:2.5rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.25rem 1.25rem 1rem}
.bundle-h{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
.bundle-h h3{font-size:1.3rem}
.bundle-tot{font-size:.95rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bundle-tot b{font-family:var(--head);font-weight:var(--head-w);font-size:1.6rem;color:var(--ink)}
.ruler-wrap{overflow-x:auto;margin-top:1rem}
.ruler-in{min-width:560px}
.ruler{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:.35rem;align-items:end}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.2rem;background:none;border:0;cursor:pointer;color:var(--ink);font:inherit;padding:.2rem 0 .1rem;border-radius:8px}
.rb:hover{background:var(--surface2)}
.rb .rval{font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.rb .rbar{display:block;width:70%;max-width:34px;min-height:3px;border-radius:6px 6px 2px 2px;background:color-mix(in oklab,var(--accent2) 65%,var(--surface));transition:height .3s}
.rb[aria-pressed="true"] .rbar{background:var(--accent)}
.rb[aria-pressed="true"] .rval{color:var(--accent)}
.rb .rl{font-size:.8rem;font-weight:600}
.ticks{height:7px;margin-top:.1rem;border-top:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 12px);background-position:0 0;background-size:auto 6px;background-repeat:repeat-x}
.bundle-cta{margin-top:1.1rem;display:flex;justify-content:flex-end}

/* samples */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:1.5rem 1.25rem}
.tile{position:relative;margin:0;display:flex;flex-direction:column;gap:.55rem}
.paper-btn{border:0;background:none;padding:0;cursor:zoom-in;display:block;width:100%;transition:transform .2s}
.paper-btn:hover{transform:translateY(-4px) rotate(-.6deg)}
.paper{container-type:inline-size;aspect-ratio:1/1.414;background:#fff;color:#1B2433;border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 12px 24px -14px rgba(15,35,53,.55);overflow:hidden;text-align:left}
.paper.img img{width:100%;height:100%;object-fit:contain;background:#fff}
.pp{padding:7cqw;font-size:3.6cqw;line-height:1.55;height:100%;display:flex;flex-direction:column;font-family:'Sarabun','Noto Sans Thai',sans-serif}
.pp-top{display:flex;justify-content:space-between;font-size:3cqw;color:#5B6B79;border-bottom:.4cqw solid #1B2433;padding-bottom:1.5cqw}
.pp-title{font-weight:700;font-size:5.6cqw;margin:3cqw 0 1.5cqw;line-height:1.35}
.pp-name{font-size:3.2cqw;color:#44525F;margin-bottom:3cqw}
.pp-name i{display:inline-block;width:26cqw;border-bottom:.35cqw dotted #44525F;height:1em;vertical-align:bottom}
.pp-name i.s{width:9cqw}
.pp .q{font-weight:600;margin-bottom:2cqw;background:#EEF3F6;border-left:1cqw solid #0E7C86;padding:1.2cqw 2cqw}
.pp .row{display:flex;gap:2cqw;align-items:flex-end;margin:2.2cqw 0}
.pp .ln{display:inline-block;border-bottom:.35cqw dotted #44525F;min-width:14cqw;height:1.1em}
.pp .grow{flex:1}
.pp .bx{display:inline-block;width:4.6cqw;height:4.6cqw;border:.5cqw solid #1B2433;border-radius:.8cqw;flex:none;align-self:center}
.pp .two{display:grid;grid-template-columns:1fr 1fr;gap:0 10cqw;margin-top:2cqw}
.pp .two>div>div{display:flex;align-items:center;gap:2cqw;margin:2.8cqw 0}
.pp .two>div:first-child>div{justify-content:space-between}
.pp .dt{display:inline-block;width:3.2cqw;height:3.2cqw;border-radius:50%;border:.5cqw solid #1B2433;flex:none}
.pp .tbl{width:100%;border-collapse:collapse;margin:1cqw 0 3cqw}
.pp .tbl th,.pp .tbl td{border:.35cqw solid #1B2433;padding:1cqw 2cqw;text-align:left}
.pp .tbl td:last-child,.pp .tbl th:last-child{text-align:right;width:22cqw}
.pp .tbl th{background:#EEF3F6}
.pp .tl{position:relative;height:8cqw;margin:5cqw 2cqw 0;display:flex;justify-content:space-between;align-items:center}
.pp .tl::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:.6cqw solid #1B2433}
.pp .tl i{position:relative;width:6cqw;height:6cqw;border-radius:50%;background:#fff;border:.6cqw solid #D43B21}
.pp .foot{margin-top:auto;text-align:right;font-size:2.8cqw;color:#7B8996}
.tile figcaption{display:flex;flex-direction:column;gap:.1rem;font-size:.9rem;line-height:1.4}
.tile .mk{font-style:normal;font-size:.75rem;color:var(--muted)}
.tile-tools{position:absolute;top:.5rem;right:.5rem;z-index:2}
.tile.add{display:none;place-items:center;border:1.5px dashed var(--accent);border-radius:var(--radius);aspect-ratio:1/1.414;color:var(--accent);background:transparent;cursor:pointer;font:600 .95rem var(--body);padding:1rem;gap:.4rem;text-align:center}
body.editing .tile.add{display:grid}

/* features / reviews */
.feat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
@media (max-width:960px){.feat{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.feat{grid-template-columns:minmax(0,1fr)}}
.f-card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;display:flex;flex-direction:column;gap:.55rem}
.f-ic{display:grid;place-items:center;width:2.7rem;height:2.7rem;border-radius:12px;background:var(--accent);color:var(--accent-ink);margin-bottom:.25rem}
.f-card h3{font-size:1.15rem}
.f-card p{color:var(--muted);font-size:.95rem}
.f-tools{position:absolute;top:.6rem;right:.6rem}
.f-add{display:none;border:1.5px dashed var(--accent);background:transparent;color:var(--accent);border-radius:var(--radius);padding:1rem;font:600 .95rem var(--body);cursor:pointer;align-items:center;justify-content:center;gap:.4rem}
body.editing .f-add{display:flex}
.rvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem}
@media (max-width:860px){.rvs{grid-template-columns:minmax(0,1fr)}}
.rv{position:relative;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;display:flex;flex-direction:column;gap:.7rem}
.stars{display:flex;gap:.1rem;color:var(--accent)}
.st{border:0;background:none;padding:0;color:color-mix(in oklab,var(--muted) 50%,transparent);cursor:default}
.st.on{color:var(--accent)}
.st.on svg{fill:currentColor}
body.editing .st{cursor:pointer}
.rv blockquote{margin:0;font-size:1.02rem}
.rv figcaption{display:flex;flex-direction:column;font-size:.9rem;color:var(--muted)}
.rv figcaption b{color:var(--ink)}

/* contact */
.contact{padding:clamp(1.5rem,4vw,3rem) 0;scroll-margin-top:4rem}
.c-band{position:relative;overflow:hidden;background:var(--accent2);color:var(--accent2-ink);border-radius:calc(var(--radius) * 1.5);padding:clamp(1.5rem,4vw,2.75rem);display:grid;grid-template-columns:1.2fr 1fr;gap:1.5rem 2rem;align-items:center}
@media (max-width:760px){.c-band{grid-template-columns:minmax(0,1fr)}}
.c-band::before{content:"";position:absolute;inset:0;background-image:linear-gradient(color-mix(in oklab,var(--accent2-ink) 12%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in oklab,var(--accent2-ink) 12%,transparent) 1px,transparent 1px);background-size:36px 36px;pointer-events:none}
.c-band>*{position:relative}
.c-band h2{font-size:clamp(1.5rem,1rem + 1.8vw,2.2rem);margin-bottom:.5rem}
.c-band p{opacity:.92}
.c-list{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.c-list li{display:flex;gap:.8rem;align-items:baseline;background:color-mix(in oklab,var(--accent2-ink) 14%,transparent);border-radius:12px;padding:.55rem .9rem}
.c-list .cl{font-size:.8rem;font-weight:700;min-width:5.2rem;opacity:.85}
.c-list a,.c-list .cv{font-weight:600;overflow-wrap:anywhere}

.foot{border-top:1px solid var(--line);padding:2rem 0 2.5rem;margin-top:1rem}
.foot-in{display:flex;gap:1rem 2rem;justify-content:space-between;flex-wrap:wrap;align-items:flex-end}
.brand-f{font-family:var(--head);font-weight:var(--head-w);font-size:1.2rem}
.to-top{font-weight:600;text-decoration:none;color:var(--muted)}

/* ---------- shop ---------- */
[hidden]{display:none!important}
.nav-tools{display:flex;gap:.4rem;align-items:center}
.badge{display:inline-grid;place-items:center;min-width:1.25rem;height:1.25rem;padding:0 .35rem;border-radius:99px;background:var(--accent-ink);color:var(--accent);font:700 .75rem var(--body)}
.tags .price{margin-left:auto;font:700 1rem/1.5 var(--body);color:var(--accent);font-variant-numeric:tabular-nums}
.tags .price.free{color:var(--accent2)}
.hws{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1rem}
@media (max-width:960px){.hws{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.hws{grid-template-columns:minmax(0,1fr)}}
.hw{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.3rem;display:flex;flex-direction:column;gap:.45rem}
.hw-n{display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:50%;background:var(--ink);color:var(--bg);font:var(--head-w) 1.1rem/1 var(--head);margin-bottom:.2rem}
.hw h3{font-size:1.1rem}
.hw p{color:var(--muted);font-size:.93rem}
.how-note{margin-top:1.25rem;display:flex;gap:.6rem;align-items:flex-start;color:var(--muted);font-size:.93rem}
.how-note .ic{margin-top:.2rem;color:var(--accent2)}
.co-steps{list-style:none;display:flex;gap:.5rem 1rem;padding:0;margin:0 0 1.25rem;flex-wrap:wrap}
.co-steps li{display:flex;align-items:center;gap:.45rem;font-size:.88rem;font-weight:600;color:var(--muted)}
.co-steps i{display:grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;border:1.5px solid var(--line);font-style:normal;font-size:.8rem}
.co-steps li.on{color:var(--ink)}
.co-steps li.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.co-steps li.done i{background:var(--accent2);border-color:var(--accent2);color:var(--accent2-ink)}
.cl{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.ci{display:flex;align-items:center;gap:.75rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.6rem .8rem;flex-wrap:wrap}
.ci>div{flex:1;min-width:8rem;display:flex;flex-direction:column;line-height:1.4}
.ci-p{font-weight:700;font-variant-numeric:tabular-nums}
.ct{display:flex;justify-content:space-between;align-items:baseline;margin:1rem 0 0;font-size:1.05rem}

let dlCap=null;
try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('downloads').then(d=>{dlCap=d||null;},()=>{});}}catch(e){}
async function saveFile(filename,data){
 if(dlCap){
  try{await dlCap.save({filename,data});return true;}
  catch(e){if(!(e&&e.code==='declined'))toast('บันทึกไฟล์ไม่ได้ในมุมมองนี้ ลองเปิดเพจในแท็บใหม่');return false;}
 }
 const blob=data instanceof Blob?data:new Blob([data]);
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(a.href),4000);return true;
}
async function sxDownload(name){
 const url=sxu(name);toast('กำลังเตรียมไฟล์…');
 let buf=null;try{const r=await fetch(url);if(r.ok)buf=await r.arrayBuffer();}catch(e){}
 if(!buf){window.open(url,'_blank','noopener');return;}
 if(await saveFile(name,buf))toast('บันทึกไฟล์แล้ว');
}

function pwScore(p){
 let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p)&&/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;if(p.length>=16)s++;
 return Math.min(4,Math.floor(s*4/6));
}
async function doChangePw(){
 const err=$('#pw-err'),o=$('#pw-old').value,n=$('#pw-new').value,c=$('#pw-cf').value,btn=$('#pw-form button[type=submit]');
 const fail=m=>{err.textContent=m;if(btn)btn.disabled=false;};
 if(!o||!n||!c){fail('กรอกให้ครบทุกช่อง');return;}
 if(n.length<8){fail('รหัสใหม่ต้องยาวอย่างน้อย 8 ตัวอักษร');return;}
 if(n!==c){fail('รหัสใหม่กับช่องยืนยันไม่ตรงกัน');return;}
 if(n===o){fail('รหัสใหม่ต้องไม่เหมือนรหัสเดิม');return;}
 if(!subtle()){fail('เบราว์เซอร์นี้ไม่รองรับการเข้ารหัส');return;}
 if(btn)btn.disabled=true;err.textContent='กำลังเปลี่ยนรหัส (อาจใช้เวลาสักครู่)…';
 if(!await adminUnlock(o)){fail('รหัสปัจจุบันไม่ถูกต้อง');return;}
 const Mold=ui.adminM;
 try{
  const locked=allLockHolders(),plain=[];
  for(const w of locked){
   const link=await decLink(w.lock,tok10(await hmac(Mold,'ws:'+w.id)),w.id);
   if(!link){fail('ถอดรหัสลิงก์ของ “'+w.title+'” ไม่ได้ ยังไม่เปลี่ยนรหัส');return;}
   plain.push([w,link]);
  }
  const salt=b64(crypto.getRandomValues(new Uint8Array(16))),Mn=await pbk(n,salt,200000);
  const chk=b64(await hmac(Mn,'check')).slice(0,16),next=[];
  for(const [w,link] of plain)next.push([w,await encLink(link,tok10(await hmac(Mn,'ws:'+w.id)),w.id)]);
  next.forEach(([w,lock])=>{w.lock=lock;});

  case 'sx-up':case 'sx-down':{
   const i=+d.i,it=S.sx.items[i],dir=a==='sx-up'?-1:1;let j=i+dir;
   while(j>=0&&j<S.sx.items.length&&S.sx.items[j].band!==it.band)j+=dir;
   if(j>=0&&j<S.sx.items.length){[S.sx.items[i],S.sx.items[j]]=[S.sx.items[j],S.sx.items[i]];touch();render();renderAdm();}

  case 'sp-amt':ui.spOther=false;ui.spAmt=+d.v;spRefresh();break;

/* ================= theme ================= */
function lum(hex){const h=hex.replace('#','');const n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);const f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);};return .2126*f(n>>16&255)+.7152*f(n>>8&255)+.0722*f(n&255);}
function inkOn(hex){try{const L=lum(hex);return 1.05/(L+.05)>=(L+.05)/(lum('#0f2335')+.05)?'#ffffff':'#0f2335';}catch(e){return '#ffffff';}}
function effectiveDark(){
 const m=S.theme.mode;if(m==='dark')return true;if(m==='light')return false;
 const dt=document.documentElement.getAttribute('data-theme');if(dt)return dt==='dark';
 return !!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
}
function palette(){
 const T=S.theme,P=PRESETS[T.preset]||PRESETS.chart,dark=effectiveDark(),p=Object.assign({},dark?P.dark:P.light);
 if(T.accent)p.accent=T.accent;if(T.accent2)p.accent2=T.accent2;if(T.bg&&!dark)p.bg=T.bg;
 return p;
}
function applyTheme(){
 const T=S.theme,p=palette(),st=document.documentElement.style;
 const m={bg:p.bg,surface:p.surface,surface2:p.surface2,ink:p.ink,muted:p.muted,line:p.line,accent:p.accent,'accent-ink':inkOn(p.accent),accent2:p.accent2,'accent2-ink':inkOn(p.accent2)};
 for(const k in m)st.setProperty('--'+k,m[k]);
 const hf=FONTS.head[T.headFont]||FONTS.head.Chonburi,bf=FONTS.body[T.bodyFont]||FONTS.body.Sarabun;
 st.setProperty('--head',hf.stack);st.setProperty('--head-w',hf.w);st.setProperty('--body',bf);
 st.setProperty('--scale',T.scale);st.setProperty('--radius',T.radius+'px');st.setProperty('--width',T.width+'px');st.setProperty('--cols',T.cols);
 st.colorScheme=effectiveDark()?'dark':'light';
}

function globeSVG(){
 const cx=200,cy=200,R=128,f=n=>n.toFixed(1);
 let ticks='';
 for(let i=0;i<72;i++){const a=i*Math.PI/36,maj=i%6===0,r1=R+12,r2=R+(maj?28:20);ticks+=`<line x1="${f(cx+r1*Math.cos(a))}" y1="${f(cy+r1*Math.sin(a))}" x2="${f(cx+r2*Math.cos(a))}" y2="${f(cy+r2*Math.sin(a))}" stroke-width="${maj?1.8:1}"/>`;}
 const par=[30,60].map(d=>{const s=Math.sin(d*Math.PI/180),c=Math.cos(d*Math.PI/180);return [-1,1].map(sg=>`<line class="g-line" x1="${f(cx-R*c)}" y1="${f(cy+sg*R*s)}" x2="${f(cx+R*c)}" y2="${f(cy+sg*R*s)}"/>`).join('');}).join('');
 const mer=[30,60].map(d=>`<ellipse class="g-line" cx="${cx}" cy="${cy}" rx="${f(R*Math.cos(d*Math.PI/180))}" ry="${R}"/>`).join('')+`<line class="g-line" x1="${cx}" y1="${cy-R}" x2="${cx}" y2="${cy+R}"/>`;
 const badges=S.strands.map((s,i)=>{const a=(-90+i*72)*Math.PI/180,r=R+50,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a);return `<g><circle cx="${f(x)}" cy="${f(y)}" r="17" fill="${esc(s.color)}"/><svg x="${f(x-10)}" y="${f(y-10)}" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${inkOn(s.color)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICON[s.id]||ICON.book}</svg></g>`;}).join('');
 return `<svg viewBox="0 0 400 400" role="img" aria-label="ลูกโลกพร้อมเส้นละติจูดลองจิจูด และสัญลักษณ์ 5 สาระการเรียนรู้"><g class="g-ring">${ticks}</g><circle class="g-body" cx="${cx}" cy="${cy}" r="${R}"/>${par}${mer}<line class="g-eq" x1="${cx-R}" y1="${cy}" x2="${cx+R}" y2="${cy}"/><circle class="g-pin" cx="${cx+24}" cy="${cy-30}" r="5"/><line class="g-lead" x1="${cx+24}" y1="${cy-30}" x2="${cx+24}" y2="${cy+40}"/><rect class="g-lbl-bg" x="${cx-68}" y="${cy+40}" width="136" height="20" rx="10"/><text class="g-lbl" x="${cx}" y="${cy+54}" text-anchor="middle">กรุงเทพฯ 13.75°N 100.50°E</text>${badges}</svg>`;
}

function b64u8(str){const b=new TextEncoder().encode(str);let o='';for(let i=0;i<b.length;i+=0x8000)o+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(o);}
async function ghCommit(html){
 const g=GH.get();
 const api='https://api.github.com/repos/'+g.repo+'/contents/'+g.path.split('/').map(encodeURIComponent).join('/');
 const H={'Authorization':'Bearer '+g.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
 const content=b64u8(html);
 for(let attempt=0;attempt<2;attempt++){
  let sha;
  const r=await fetch(api+'?ref='+encodeURIComponent(g.branch),{headers:H,cache:'no-store'});
  if(r.status===200){const j=await r.json();sha=j&&j.sha;}
  else if(r.status!==404){const e=new Error('get '+r.status);e.status=r.status;throw e;}
  const body={message:'อัปเดตเพจใบงานสังคมศึกษา',content:content,branch:g.branch};
  if(sha)body.sha=sha;
  const w=await fetch(api,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},H),body:JSON.stringify(body)});
  if(w.ok)return true;
  if((w.status===409||w.status===422)&&attempt===0)continue;
  const e=new Error('put '+w.status);e.status=w.status;throw e;
 }
}
function ghErr(err){
 const st=err&&err.status;
 if(st===401)return 'โทเค็น GitHub ไม่ถูกต้องหรือหมดอายุ';
 if(st===403)return 'โทเค็นไม่มีสิทธิ์เขียนไฟล์ ต้องตั้งสิทธิ์ Contents: Read and write';
 if(st===404)return 'ไม่พบ repo หรือ branch นี้ หรือโทเค็นยังเข้าถึง repo นี้ไม่ได้';
 if(st===409||st===422)return 'มีการแก้ไขไฟล์จากที่อื่นพร้อมกัน ลองกดบันทึกอีกครั้ง';
 return 'เชื่อมต่อ GitHub ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง';
}

/* ================= images ================= */
function loadImage(file,max){
 return new Promise((res,rej)=>{
  const fr=new FileReader();
  fr.onload=()=>{const im=new Image();im.onload=()=>{
   const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(im.width*s));c.height=Math.max(1,Math.round(im.height*s));
   c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   let out=c.toDataURL('image/webp',.82);
   if(out.indexOf('data:image/webp')!==0)out=c.toDataURL(file.type==='image/png'?'image/png':'image/jpeg',.82);
   res(out);
  };im.onerror=rej;im.src=fr.result;};
  fr.onerror=rej;fr.readAsDataURL(file);
 });
}

  }
 }else rec.url=url;
 if(existing)Object.assign(existing,rec);else S.worksheets.push(Object.assign({id},rec));
 closeModal();touch();render();renderAdm();toast('บันทึกใบงานแล้ว');
}

  case 'import':openModal(`${xBtn}<h2 class="md-h">นำเข้าข้อมูล</h2><p class="muted small" style="margin-bottom:.75rem">วางข้อมูลสำรองที่คัดลอกไว้ ข้อมูลปัจจุบันของเพจจะถูกแทนที่</p><textarea class="big" id="imp" aria-label="วางข้อมูลสำรอง"></textarea><p class="err" id="imp-err" role="alert"></p><div class="form-a"><button class="btn" data-act="close-modal">ยกเลิก</button><button class="btn pri" data-act="import-apply">นำเข้า</button></div>`,'md2');break;

 }

function bindValue(t,b){
 const v=t.type==='checkbox'?t.checked:(t.type==='range'||t.type==='number')?Number(t.value):t.value;
 setP(S,b,v);touch();
 if(b.indexOf('theme.')===0){applyTheme();if(t.type==='range'){const l=t.closest('label');if(l&&l.firstChild)l.firstChild.textContent=l.firstChild.textContent.replace(/\(.*\)/,'('+(b==='theme.scale'?Math.round(v*100)+'%':v+'px')+')');}}
 else if(/^(strands|contacts|sections|shop|sx|support)\./.test(b))raf(render);
}

/* ================= PromptPay QR ================= */
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v;}
function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;}return c.toString(16).toUpperCase().padStart(4,'0');}
function ppPayload(target,amount){
 let t=String(target).replace(/\D/g,''),tag,val;
 if(/^0\d{9}$/.test(t)){tag='01';val='0066'+t.slice(1);}
 else if(t.length===13){tag='02';val=t;}
 else{tag='03';val=t;}
 const acct=tlv('00','A000000677010111')+tlv(tag,val),amt=Number(amount)>0;
 let p=tlv('00','01')+tlv('01',amt?'12':'11')+tlv('29',acct)+tlv('58','TH')+tlv('53','764')+(amt?tlv('54',Number(amount).toFixed(2)):'');
 p+='6304';return p+crc16(p);
}
function drawQR(cv,text){
 if(!cv||typeof window.qrcode!=='function')return false;
 try{
  const qr=window.qrcode(0,'M');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),q=4,cell=8,size=(n+2*q)*cell;
  cv.width=cv.height=size;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,size,size);x.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))x.fillRect((c+q)*cell,(r+q)*cell,cell,cell);
  return true;
 }catch(e){return false;}
}

const TE=new TextEncoder(),TD=new TextDecoder();
const b64=u8=>{u8=new Uint8Array(u8);let s='';for(let i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64u=u8=>b64(u8).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>unb64(s.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-s.length%4)%4));
const subtle=()=>window.crypto&&window.crypto.subtle;
async function pbk(pass,salt,iter){const k=await subtle().importKey('raw',TE.encode(pass),'PBKDF2',false,['deriveBits']);return new Uint8Array(await subtle().deriveBits({name:'PBKDF2',hash:'SHA-256',salt:TE.encode(salt),iterations:iter},k,256));}
async function hmac(keyBytes,msg){const k=await subtle().importKey('raw',keyBytes,{name:'HMAC',hash:'SHA-256'},false,['sign']);return new Uint8Array(await subtle().sign('HMAC',k,TE.encode(msg)));}
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function tok10(bytes){let bits=0,val=0,out='';for(let i=0;i<bytes.length&&out.length<10;i++){val=(val<<8)|bytes[i];bits+=8;while(bits>=5&&out.length<10){out+=B32[(val>>>(bits-5))&31];bits-=5;}val&=(1<<bits)-1;}return out;}
const normTok=s=>String(s).toUpperCase().replace(/[OIL]/g,m=>m==='O'?'0':'1').replace(/U/g,'V');
async function wsToken(wsId){return tok10(await hmac(ui.adminM,'ws:'+wsId));}
async function linkKey(token,wsId){return subtle().importKey('raw',await pbk(normTok(token),'ws:'+wsId,100000),'AES-GCM',false,['encrypt','decrypt']);}
async function encLink(link,token,wsId){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=await subtle().encrypt({name:'AES-GCM',iv},await linkKey(token,wsId),TE.encode(link));return b64(iv)+'.'+b64(ct);}
async function decLink(lock,token,wsId){try{const p=String(lock).split('.');const pt=await subtle().decrypt({name:'AES-GCM',iv:unb64(p[0])},await linkKey(token,wsId),unb64(p[1]));return TD.decode(pt);}catch(e){return null;}}
async function adminSetup(pass){const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const M=await pbk(pass,salt,200000);S.shop.salt=salt;S.shop.chk=b64(await hmac(M,'check')).slice(0,16);ui.adminM=M;touch();}
async function adminUnlock(pass){if(!S.shop.salt||!pass)return false;const M=await pbk(pass,S.shop.salt,200000);if(b64(await hmac(M,'check')).slice(0,16)!==S.shop.chk)return false;ui.adminM=M;return true;}
async function claimCode(text){
 const re=/\b([wpm][a-z0-9]*(?:_[a-z]+)?)-([0-9a-z]{10})\b/gi,found=[],got=[];let m;
 while((m=re.exec(text)))found.push([m[1].toLowerCase(),m[2]]);
 for(const [id,tk] of found){
  const si=slotInfo(id);
  if(!si||!si.rec.lock||got.some(g=>g.id===si.id))continue;
  const link=await decLink(si.rec.lock,tk,si.id);
  if(link&&/^https?:\/\//i.test(link)){SH.owned[si.id]=link;got.push({id:si.id,title:si.title+(si.label?' · '+si.label:''),link});}
 }
 saveSH('owned');return {found:found.length,got};
}

async function sendNotify(body){
 const url=S.shop.notifyUrl;
 if(!/^https:\/\//i.test(url||''))return {ok:false,why:'unset'};
 if(!STANDALONE)return {ok:false,why:'blocked'};
 let t;
 try{
  const ctl=new AbortController();t=setTimeout(()=>ctl.abort(),15000);
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body),signal:ctl.signal});
  clearTimeout(t);
  let j=null;try{j=await r.json();}catch(e){}
  const msg=j&&j.message?String(j.message):'';
  if(/activat/i.test(msg))return {ok:false,why:'activation',msg};
  const flag=j?(j.success!==undefined?j.success:j.ok):undefined;
  if(r.ok&&(flag===undefined||flag===true||flag==='true'))return {ok:true,msg};
  return {ok:false,why:'ตอบกลับ '+r.status+(msg?': '+msg:''),msg};
 }catch(e){clearTimeout(t);return {ok:false,why:'network'};}
}

async function buildReply(r,withCodes){
 const L=['เรียนคุณ '+(r.name||'ลูกค้า'),'','ขอบคุณที่สั่งซื้อจาก '+S.text.brand+' ตรวจสอบยอดโอนของออเดอร์ '+r.code+' เรียบร้อยแล้ว ลิงก์ไฟล์ที่สั่งซื้อมีดังนี้',''];
 const seen=new Set(),codes=[];let n=0,missing=0;
 const slotLines=async(o)=>{
  const out=[];
  for(const sid of o.slots){
   const si=slotInfo(sid);if(!si)continue;
   const name=si.label||'ลิงก์ไฟล์';
   if(seen.has(sid)){out.push('   • '+name+': (ส่งไว้แล้วในรายการข้างต้น)');continue;}
   seen.add(sid);
   const l=await slotPlain(sid);
   if(l){out.push('   • '+name+': '+l);if(si.rec.lock)codes.push(sid+'-'+await wsToken(sid));}
   else{out.push('   • '+name+': (ยังไม่ได้ใส่ลิงก์ — ใส่ในหลังบ้านก่อนส่ง)');missing++;}
  }
  return out;
 };
 for(const id of r.ids){
  const o=findOffer(id,true);
  if(!o){L.push((++n)+'. (ไม่พบสินค้ารหัส '+id+' ในเพจแล้ว ติดต่อผู้ซื้อเพื่อยืนยันรายการ)');missing++;continue;}
  if(o.kind==='pack'){
   L.push((++n)+'. แพ็กเกจ: '+o.title);
   for(const p of o.parts){L.push('  - '+p.title+(p.label?' — '+p.label:''));(await slotLines(p)).forEach(x=>L.push(x));}
  }else{L.push((++n)+'. '+offerName(o));(await slotLines(o)).forEach(x=>L.push(x));}
 }
 if(withCodes&&codes.length)L.push('','รหัสรับไฟล์ (ใช้ที่ปุ่ม “รับไฟล์” บนเว็บ ถ้าต้องการเก็บลิงก์ไว้ในเครื่อง):',codes.join('\n'),siteUrl()?'เว็บไซต์: '+siteUrl():'');
 L.push('','หากเปิดลิงก์ไม่ได้ หรือต้องการความช่วยเหลือ ตอบกลับอีเมลฉบับนี้ได้เลย','ขอบคุณที่สนับสนุน '+S.text.brand);
 return {text:L.join('\n'),missing};
}

async function saveProd(){

 if(!title){err.textContent='กรุณาใส่ชื่อ'+cfg.name;$('#p-title').focus();return;}
 if(!ui.adminM){err.textContent='ต้องเข้าสู่ระบบผู้ดูแลก่อน เพื่อเข้ารหัสลิงก์ไฟล์';return;}
 const isNew=!ui.wsEdit.id,id=ui.wsEdit.id||(cfg.pre+uid());
 const price={};cfg.opts.forEach(([k])=>{const v=$('#p-price-'+k).value.trim();price[k]=v===''?'':Math.max(0,Math.round((Number(v)||0)*100)/100);});
 const rec0={id,price};
 const link={};let paidNoLink=0;
 err.textContent='กำลังบันทึก…';
 for(const [s] of cfg.slots){
  let url=$('#p-link-'+s).value.trim();

  }
 }
 cfg.opts.forEach(([k,,sl])=>{const v=price[k];if(v!==''&&v>0&&sl.some(s=>!(link[s].url||link[s].lock)))paidNoLink++;});
 const rec={id,on:$('#p-on').checked,title,grade:$('#p-grade').value,strand:$('#p-strand').value,term:kind==='plan'?$('#p-term').value:'',pages:Math.max(0,parseInt($('#p-pages').value,10)||0),note:$('#p-note').value.trim(),img:ui.wsEdit.img||'',price,link};
 const list=S[cfg.list],ex=isNew?null:list.find(x=>x.id===id);
 if(ex)Object.assign(ex,rec);else list.push(rec);
 closeModal();touch();render();renderAdm();
 toast(paidNoLink?'บันทึกแล้ว แต่ยังมีแบบที่ขายแล้วไม่มีลิงก์ไฟล์ ใส่ลิงก์ก่อนส่งให้ผู้ซื้อ':'บันทึก'+cfg.name+'แล้ว');
}

function ntShow(r){
 const to=esc(S.shop.notifyTo||'อีเมลของคุณ');
 let h;
 if(r.ok)h=`<div class="note-box ok"><b>ส่งคำขอไปที่ระบบส่งอีเมลสำเร็จ</b><br>ตรวจกล่องอีเมล ${to} (รวมสแปม) ถ้าเป็นครั้งแรก FormSubmit จะส่งอีเมลขอให้ยืนยันก่อน กดยืนยัน แล้วกดทดสอบอีกครั้งเพื่อให้แน่ใจว่าอีเมลทดสอบมาถึง${r.msg?`<br><span class="small muted">ข้อความจากระบบ: ${esc(r.msg)}</span>`:''}</div>`;
 else if(r.why==='activation')h=`<div class="note-box warn"><b>รอการยืนยันอีเมล</b><br>ระบบส่งอีเมลขอยืนยัน (Activate) ไปที่ ${to} แล้ว เปิดอีเมลนั้นแล้วกดยืนยัน จากนั้นกดทดสอบอีกครั้ง${r.msg?`<br><span class="small muted">${esc(r.msg)}</span>`:''}</div>`;
 else if(r.why==='blocked')h='<div class="note-box warn"><b>ทดสอบจากเพจนี้ไม่ได้</b><br>เพจที่โฮสต์บน Claude บล็อกการส่งข้อมูลออกนอกเพจ จึงส่งอีเมลอัตโนมัติไม่ได้ ให้ทดสอบจากเพจที่เปิดบน GitHub Pages หรือไฟล์ HTML</div>';
 else if(r.why==='unset')h='<div class="note-box warn">ยังไม่ได้ใส่ปลายทางส่งอีเมล (ต้องขึ้นต้นด้วย https://)</div>';
 else if(r.why==='network')h='<div class="note-box warn"><b>เชื่อมต่อไม่ได้</b><br>ตรวจอินเทอร์เน็ต และตรวจว่าลิงก์ปลายทางถูกต้อง</div>';
 else h=`<div class="note-box warn"><b>ส่งไม่สำเร็จ</b><br>${esc(r.why)}</div>`;
 ui.ntOut=h;const b=$('#nt-out');if(b)b.innerHTML=h;
}
function act3(a,el,d){
 switch(a){
  case 'add-prod':openProdModal(d.k,null);break;
  case 'edit-prod':{const p=findProd(d.id);if(p)openProdModal(prodKind(p),p.id);break;}
  case 'del-prod':{const p=findProd(d.id);if(!p)break;ask('ลบ “'+p.title+'” ออกจากเพจหรือไม่ (ถ้าอยู่ในแพ็กเกจ รายการนี้จะไม่ถูกนับในแพ็กเกจอีก)',()=>{const l=S[PROD[prodKind(p)].list];l.splice(l.indexOf(p),1);touch();render();renderAdm();},'ลบ');break;}
  case 'tog-prod':{const p=findProd(d.id);if(p){p.on=p.on===false;touch();render();renderAdm();}break;}
  case 'add-pack':openPackModal(null);break;
  case 'edit-pack':openPackModal(d.id);break;
  case 'del-pack':{const k=S.packs.find(x=>x.id===d.id);if(!k)break;ask('ลบแพ็กเกจ “'+k.title+'” หรือไม่',()=>{S.packs.splice(S.packs.indexOf(k),1);touch();render();renderAdm();},'ลบแพ็กเกจ');break;}
  case 'tog-pack':{const k=S.packs.find(x=>x.id===d.id);if(k){k.on=k.on===false;touch();render();renderAdm();}break;}
  case 'cat-tab':ui.cat.tab=d.t;renderAdm();break;
  case 'cat-copy':slotPlain(d.s).then(l=>{if(l)copyText(l);else toast('ถอดรหัสลิงก์ไม่ได้ ใส่ลิงก์ใหม่ในฟอร์มแก้ไข');});break;
  case 'pk-all':{const e=ui.packEdit;packListFiltered().forEach(o=>{if(!e.items.includes(o.oid))e.items.push(o.oid);});$('#pk-list').innerHTML=packListInner();$('#pk-sum').innerHTML=packSummary();break;}
  case 'pk-none':{ui.packEdit.items=[];$('#pk-list').innerHTML=packListInner();$('#pk-sum').innerHTML=packSummary();break;}
  case 'co-retry':{const o=SH.orders.find(x=>x.code===d.code);if(o){o.notify=null;startNotify(o);const b=$('#co-notify');if(b)b.innerHTML=notifyBoxHTML(o);}break;}
  case 'notify-test':{const b=$('#nt-out');if(b)b.innerHTML='<p class="muted">กำลังส่ง…</p>';sendNotify(notifyBody(null,true)).then(ntShow);break;}
  case 'ob-import':obImport();break;
  case 'ob-local':obLocal();break;
  case 'ob-filter':ui.obFilter=d.f;renderAdm();break;
  case 'ob-paid':{const r=SH.inbox.find(x=>x.code===d.code);if(r){r.status='paid';saveSH('inbox');renderAdm();}break;}
  case 'ob-sent':{const r=SH.inbox.find(x=>x.code===d.code);if(r){r.status='sent';r.sentAt=Date.now();saveSH('inbox');renderAdm();toast('ทำเครื่องหมายว่าส่งลิงก์แล้ว');}break;}
  case 'ob-undo':{const r=SH.inbox.find(x=>x.code===d.code);if(r){r.status='paid';r.sentAt=0;saveSH('inbox');renderAdm();}break;}
  case 'ob-del':{const r=SH.inbox.find(x=>x.code===d.code);if(r)ask('ลบออเดอร์ '+r.code+' ของ '+(r.name||'ผู้ซื้อ')+' ออกจากรายการหรือไม่ (ข้อมูลนี้ไม่มีที่อื่นสำรอง)',()=>{SH.inbox=SH.inbox.filter(x=>x.code!==r.code);delete ui.obReply[r.code];saveSH('inbox');renderAdm();},'ลบออเดอร์');break;}
  case 'ob-copy':{const t=document.getElementById('ob-ta-'+d.code);if(t)copyText(t.value);break;}
  case 'ob-copyto':{const r=SH.inbox.find(x=>x.code===d.code);if(r)copyText(r.email);break;}
  case 'ob-regen':obFill(d.code,true);break;
  case 'ob-export':copyText(JSON.stringify(SH.inbox));break;
  default:act4(a,d);
 }
}
function act3Submit(e){
 const id=e.target.id;
 if(id==='prod-form'){e.preventDefault();saveProd();return true;}
 if(id==='pack-form'){e.preventDefault();savePack();return true;}
 return false;
}
function act3Input(t){
 if(t.id==='ob-in'){ui.obIn=t.value;return true;}
 if(t.dataset&&t.dataset.ob==='reply'){const c=ui.obReply[t.dataset.code];if(c){c.text=t.value;obSyncMail(t.dataset.code);}return true;}
 if(t.id==='pk-q'){ui.packEdit.q=t.value;$('#pk-list').innerHTML=packListInner();return true;}
 if(t.id==='pk-price'){$('#pk-sum').innerHTML=packSummary();return true;}
 return false;
}
function act3Change(t){
 if(t.dataset&&t.dataset.pf){ui.pf[t.dataset.pf]=t.value;const g=$('#grid-'+t.dataset.pf);if(g)g.innerHTML=prodGridInner(t.dataset.pf);return true;}
 if(t.dataset&&'catGrade' in t.dataset){ui.cat.grade=t.value;renderAdm();return true;}
 if(t.dataset&&t.dataset.ob==='codes'){ui.obCodes[t.dataset.code]=t.checked;obFill(t.dataset.code,true);return true;}
 if(t.id==='pk-type'||t.id==='pk-grade'){ui.packEdit[t.id==='pk-type'?'type':'grade']=t.value;$('#pk-list').innerHTML=packListInner();return true;}
 if(t.dataset&&t.dataset.pkItem!==undefined){const e=ui.packEdit,id=t.dataset.pkItem;e.items=e.items.filter(x=>x!==id);if(t.checked)e.items.push(id);$('#pk-sum').innerHTML=packSummary();return true;}
 if(t.dataset&&t.dataset.bind==='shop.notifyTo'){const v=t.value.trim();if(/^https:\/\/formsubmit\.co\/ajax\//.test(S.shop.notifyUrl||'')&&EMAIL_RE.test(v)){S.shop.notifyUrl='https://formsubmit.co/ajax/'+v;touch();renderAdm();}return false;}
 return false;
}

 const seg=`<div class="seg" role="group" aria-label="เลือกดู"><button data-act="k-tab" data-t="s" aria-pressed="${slides}">สไลด์ 3D</button><button data-act="k-tab" data-t="p" aria-pressed="${!slides}">แผนการสอน</button></div>`;
 const main=slides?
  `<div class="kv-stage" id="kv-stage" role="img" aria-label="สไลด์ที่ ${v.n+1} จาก 6 ของ ${esc(k.title)}" style="${kitImg(k,v.n)}"></div>
   <div class="kv-ctl"><button class="ib" data-act="k-sl" data-d="-1" aria-label="สไลด์ก่อนหน้า">${ic('arrow',16).replace('<svg','<svg style="transform:scaleX(-1)"')}</button><span id="kv-cnt">${v.n+1} / 6</span><button class="ib" data-act="k-sl" data-d="1" aria-label="สไลด์ถัดไป">${ic('arrow',16)}</button></div>
   <div class="kv-strip">${[0,1,2,3,4,5].map(n=>`<button class="kv-t" data-act="k-go" data-n="${n}" aria-label="ไปสไลด์ที่ ${n+1}" aria-pressed="${n===v.n}" style="${kitImg(k,n)}"></button>`).join('')}</div>`:
  `<div class="kv-plan"><div class="kv-pp" role="img" aria-label="แผนการสอน หน้า 1" style="${kitPlanImg(k,0)}"></div><div class="kv-pp" role="img" aria-label="แผนการสอน หน้า 2" style="${kitPlanImg(k,1)}"></div></div>`;
 const nav=sib.length>1?`<div class="sxv-nav"><button class="ib" data-act="k-step" data-d="-1" aria-label="ชุดก่อนหน้า">${ic('arrow',16).replace('<svg','<svg style="transform:scaleX(-1)"')}</button><span>${pos+1}/${sib.length}</span><button class="ib" data-act="k-step" data-d="1" aria-label="ชุดถัดไป">${ic('arrow',16)}</button></div>`:'';
 const dls=allow?`<div class="kv-dl"><div><b>สไลด์</b>${sxPdfLink(k.id+'-slides.pptx','PowerPoint (แก้ไขได้)','sm pri')}${sxPdfLink(k.id+'-slides.pdf','PDF','sm')}</div><div><b>แผนการสอน</b>${sxPdfLink(k.id+'-plan.pdf','PDF','sm pri')}${sxPdfLink(k.id+'-plan.docx','Word','sm')}</div></div>`:'<p class="mini muted">ผู้ดูแลปิดการดาวน์โหลดตัวอย่างไว้ ดูภาพตัวอย่างได้ตามปกติ</p>';
 return `${xBtn}<div class="kv ${slides?'kv-s':'kv-p'}" style="--c:${esc(s.color)}">
  <div class="kv-main">${main}</div>
  <div class="kv-side"><div class="tags"><span class="tag solid">${esc(k.grade)}</span><span class="tag">${esc(s.short)}</span></div>
   <h2 class="md-h" style="margin:0;padding-right:2.5rem">${esc(k.title)}</h2>${seg}
   <div class="kv-goals"><h4>จุดประสงค์การเรียนรู้</h4><ol>${k.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ol></div>
   <p class="mini muted">${ic('clock',14)} คาบเรียน ${+k.min||50} นาที · กิจกรรมหลัก: ${esc(k.act)}</p>
   ${dls}<div class="sxv-a">${nav}</div>
   <p class="mini muted">ไฟล์ PowerPoint มีบันทึกผู้สอนในแต่ละสไลด์ ติดตั้งฟอนต์ Sarabun, Prompt, Mali เพื่อให้ตัวอักษรตรงกับต้นแบบ</p></div></div>`;
}
function kitOpen(id,tab){if(!kitById(id))return;ui.kView={id,tab:tab||'s',n:0};openModal(kitViewHTML(),'sxm kvm');}
function kitRedraw(){if(ui.kView&&$('#modal .kv'))openModal(kitViewHTML(),'sxm kvm');}
function kitSlide(n){
 const v=ui.kView;if(!v)return;v.n=(n+6)%6;const k=kitById(v.id);
 const st=$('#kv-stage');if(st){st.style.cssText=kitImg(k,v.n);st.setAttribute('aria-label','สไลด์ที่ '+(v.n+1)+' จาก 6 ของ '+k.title);}
 const c=$('#kv-cnt');if(c)c.textContent=(v.n+1)+' / 6';
 $$('.kv-t').forEach((t,i)=>t.setAttribute('aria-pressed',String(i===v.n)));
}
function kitStep(d){
 const v=ui.kView;if(!v)return;const k=kitById(v.id),sib=kitSibs(k.band);if(sib.length<2)return;
 v.id=sib[(sib.indexOf(k)+d+sib.length)%sib.length].id;v.n=0;kitRedraw();
}
function act4(a,d){
 switch(a){
  case 'k-band':ui.kBand=d.b;kitRefresh();return true;
  case 'k-open':kitOpen(d.id);return true;
  case 'k-tab':if(ui.kView){ui.kView.tab=d.t;kitRedraw();}return true;
  case 'k-sl':if(ui.kView)kitSlide(ui.kView.n+ +d.d);return true;
  case 'k-go':kitSlide(+d.n);return true;
  case 'k-step':kitStep(+d.d);return true;
 }
 return false;
}
document.addEventListener('keydown',e=>{
 if(!ui.kView||!$('#modal .kv-s'))return;
 if(e.key==='ArrowRight'){kitSlide(ui.kView.n+1);e.preventDefault();}
 else if(e.key==='ArrowLeft'){kitSlide(ui.kView.n-1);e.preventDefault();}
});

/* ================= boot ================= */
const SHELL=`<div id="app"></div><div id="overlay"><div id="bar"></div><aside id="panel" class="panel" hidden aria-label="แผงปรับแต่งเพจ"></aside><div id="adm" class="adm" hidden></div><div id="modal"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><input id="up-sample" type="file" accept="image/*" data-upload="sample" hidden></div>`;
$('#root').innerHTML=SHELL;
load();applyTheme();render();buildBar();
if(ui.justSaved)toast('บันทึกขึ้นเพจแล้ว');
restoreAdmin().then(()=>{
 if(!ui.adminM&&/[#?&](edit|admin)\b/.test(location.hash+location.search))openLogin();
 else if(ui.adminM&&ui.admReopen){openAdm(ui.admReopen);ui.admReopen='';}
});
try{
 const mq=window.matchMedia('(prefers-color-scheme: dark)');
 if(mq.addEventListener)mq.addEventListener('change',()=>{applyTheme();});
 new MutationObserver(()=>applyTheme()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}catch(e){}
try{if(window.claude&&typeof window.claude.use==='function'){window.claude.use('artifact').then(a=>{cap=a||null;},()=>{});}}catch(e){}
})();
</script>
